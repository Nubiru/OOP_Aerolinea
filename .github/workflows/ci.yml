name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ───────────────────────────────────────────────────────────────────────
  # 1. Tipos + smoke test del modelo de dominio + round-trip DB→dominio
  # ───────────────────────────────────────────────────────────────────────
  test:
    name: Test (tsc + demo + seed/verify)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript build
        run: npm run build

      - name: Demo del modelo de dominio
        run: npm run demo

      - name: Seed + verify round-trip
        run: |
          npm run seed
          npm run verify

  # ───────────────────────────────────────────────────────────────────────
  # 2. Build de la imagen Docker (no la pushea, solo verifica que compila)
  # ───────────────────────────────────────────────────────────────────────
  docker:
    name: Build Docker image
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build (sin push, con cache de GHA)
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          load: true
          tags: oop-aerolinea:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test del contenedor (health endpoint)
        run: |
          docker run -d --name api-test -p 3000:3000 oop-aerolinea:ci-${{ github.sha }}
          # Esperar healthy o timeout
          for i in {1..30}; do
            if curl -fsS http://localhost:3000/api/health > /dev/null; then
              echo "✓ API respondiendo"
              exit 0
            fi
            sleep 1
          done
          echo "✗ API no respondió en 30s"
          docker logs api-test
          exit 1
