<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OOP Aerolínea — Panel de Gestión</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <header class="topbar">
    <div class="brand">
      <span class="logo">✈</span>
      <div>
        <h1>OOP Aerolínea</h1>
        <p class="subtitle">Sistema de gestión — práctica universitaria de POO</p>
      </div>
    </div>
    <div class="header-info" id="header-info">cargando...</div>
  </header>

  <nav class="tabs" id="tabs">
    <button class="tab active" data-tab="flota">Flota</button>
    <button class="tab" data-tab="empleados">Empleados</button>
    <button class="tab" data-tab="vuelos">Vuelos</button>
    <button class="tab" data-tab="diagnostico">Diagnóstico</button>
    <button class="tab" data-tab="operaciones">Operaciones</button>
    <button class="tab" data-tab="oop">Modelo OOP</button>
  </nav>

  <main class="container">
    <section class="panel active" id="panel-flota"></section>
    <section class="panel" id="panel-empleados"></section>
    <section class="panel" id="panel-vuelos"></section>
    <section class="panel" id="panel-diagnostico"></section>
    <section class="panel" id="panel-operaciones"></section>
    <section class="panel" id="panel-oop"></section>
  </main>

  <div id="toast-container"></div>

  <script src="app.js"></script>
</body>
</html>
